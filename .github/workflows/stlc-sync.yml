name: Sync SDK repos

# Back-sync production into staging, so a release (or any commit landed
# directly on production) doesn't leave the trunks forked. Production is
# public, so it's fetched with no credential; only the push into this repo's
# own main needs the App token, to satisfy the branch ruleset. No token or
# workflow is added to the production repo — this file lives in staging only.
on:
  schedule:
    # Cheap pure-git check twice hourly; a no-op when staging already contains
    # production main.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  back-sync:
    # Runner comes from the STLC_RUNNER repo/org variable when set; defaults to GitHub-hosted.
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    if: github.repository == 'augustus/node-sdk-staging'
    concurrency:
      group: stlc-back-sync
      cancel-in-progress: true
    env:
      PRODUCTION_REPO: augustus/node-sdk
    steps:
      - name: Check out staging
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch production main
        run: |
          # Production is public — no credential needed to read it.
          git remote add production "https://github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether staging already has production main
        id: diff
        run: |
          # Compare ancestry, not trees: a content-empty commit on production
          # (e.g. a manual merge-commit PR) must still come back, or staging is
          # no longer a descendant of production and emerald holds codegen.
          if git merge-base --is-ancestor production/main origin/main; then
            echo "Staging already contains production main. Nothing to pull back."
            echo "behind=false" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor origin/main production/main; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Back-sync blocked::The trunks have forked (neither main is an ancestor of the other). Heal with a merge-commit PR that merges production main into staging."
            exit 1
          fi

      - name: Generate GitHub App token
        if: steps.diff.outputs.behind == 'true'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.IVY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IVY_RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write

      - name: Push production/main onto staging main
        if: steps.diff.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            production/main:refs/heads/main
          echo "Fast-forwarded staging main to production/main."

      - name: Send failure notification to Slack
        if: failure()
        uses: augustus/actions/.github/actions/slack-job-status@e2e323107d7db47f8112eeed5853ecab8cab3e87 # v1.34.4
        with:
          job_name: 'stlc back-sync'
          status: failure
          channel_id: 'C0BSAEGQWHH'
