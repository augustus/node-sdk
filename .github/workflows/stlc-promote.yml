name: Promote SDKs

# Promote staging to production by fast-forwarding production main up to staging,
# preserving SHAs so the trunks stay identical and linear (nothing to heal on the
# next stlc build). Fires on every push to staging main (an stlc build, a merged PR,
# a back-sync fast-forward) — the diff check right below makes an already-synced
# push a no-op, so this is safe to run unconditionally. workflow_dispatch stays for
# a manual re-run. release-please itself (opening/updating the version PR, and
# tagging one a human already merged) lives entirely in the scheduled stlc-release
# workflow now — this workflow only ever fast-forwards.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  promote:
    # Runner comes from the STLC_RUNNER repo/org variable when set; defaults to GitHub-hosted.
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    if: github.repository == 'augustus/node-sdk-staging'
    concurrency:
      group: stlc-promote
      cancel-in-progress: true
    # No required reviewers on this environment: promote runs unattended. Adding
    # reviewers would pause every push-triggered run and let the trunks drift.
    environment: production
    env:
      PRODUCTION_REPO: augustus/node-sdk
    steps:
      - name: Check out staging
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.IVY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IVY_RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: node-sdk
          permission-contents: write

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git remote add production \
            "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether production already has staging main
        id: diff
        run: |
          # Compare ancestry, not trees: a content-empty commit on staging (e.g. a
          # reconcile merge) must still reach production, or the next release
          # forks the trunks.
          if git merge-base --is-ancestor origin/main production/main; then
            echo "Production already contains staging main. Nothing to promote."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor production/main origin/main; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Promote blocked::The trunks have forked (neither main is an ancestor of the other). Back-sync production into staging with a merge-commit PR first."
            exit 1
          fi

      - name: Promote staging to production (fast-forward)
        if: steps.diff.outputs.synced == 'false'
        run: |
          # The App token has no `workflows` permission, so GitHub rejects a push
          # that changes workflow files. Fail with the manual procedure instead.
          if [ -n "$(git diff --name-only production/main origin/main -- .github/workflows)" ]; then
            echo "::error title=Promote needs a manual PR::Staging main changes .github/workflows, which the App can't push. Open a PR on ${PRODUCTION_REPO} from a branch at staging main and merge it with 'Create a merge commit'; back-sync then fast-forwards staging to that merge."
            exit 1
          fi
          git push production origin/main:refs/heads/main
          echo "Fast-forwarded production/main to staging/main."

      - name: Send failure notification to Slack
        if: failure()
        uses: augustus/actions/.github/actions/slack-job-status@e2e323107d7db47f8112eeed5853ecab8cab3e87 # v1.34.4
        with:
          job_name: 'stlc promote'
          status: failure
          channel_id: 'C0BSAEGQWHH'
